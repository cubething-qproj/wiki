<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>edit</title>
		<style>
			:root { color-scheme: light dark; }
			body { margin: 0; height: 100vh; display: grid; grid-template-rows: auto 1fr; font: 14px system-ui, sans-serif; }
			header { display: flex; gap: 1rem; align-items: center; padding: 0.3rem 0.8rem; border-bottom: 1px solid #8884; }
			#status { margin-left: auto; opacity: 0.7; }
			#status.error { color: #e5484d; opacity: 1; }
			#panes { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
			#left { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid #8884; }
			#editor { flex: 1; min-height: 0; overflow: auto; }
			#editor .cm-editor { height: 100%; }
			#preview { width: 100%; height: 100%; border: 0; }
			#error { max-height: 40%; overflow: auto; margin: 0; padding: 0.5rem;
				border-top: 2px solid #e5484d; white-space: pre-wrap; }
		</style>
	</head>
	<body>
		<header>
			<strong id="name"></strong>
			<a id="view">view page</a>
			<label><input id="autosave" type="checkbox" checked /> autosave</label>
			<span id="status"></span>
		</header>
		<div id="panes">
			<div id="left">
				<div id="editor"></div>
				<pre id="error" hidden></pre>
			</div>
			<iframe id="preview"></iframe>
		</div>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
